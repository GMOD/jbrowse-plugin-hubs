name: Push

on: push

jobs:
  build-and-lint:
    name: Build, lint, and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest
      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm prettier --check .

  # Boots the CANDIDATE build on hosted JBrowse releases against the ucsc configs
  # that actually name this plugin.
  #
  # This is the check that was missing when 1.0.9 shipped `appendToMenu('File')`.
  # Every released core from v4.0.0 to latest defines the File menu as a thunk and
  # appends with `menu.menuItems.push()`, so configure() threw and hg38, hg19,
  # mm39 and hs1 were error pages on every hosted release -- while core@main,
  # which resolves menu contributions lazily, was perfectly happy. That asymmetry
  # is the whole problem: the host you develop against is the one host that works.
  #
  # A throw out of configure() is invisible to tsc, eslint, and a url reachability
  # check, and the store serves `latest/` no-cache, so the damage lands on configs
  # shipped months ago the instant a tag is pushed. Verified this job fails on
  # exactly that regression before it was added.
  host-compat:
    name: Host compat (candidate build on hosted releases)
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest
      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Boot the built bundle on released hosts
        env:
          # preinstalled on the ubuntu runner image, so puppeteer-core needs no
          # browser action and no Chromium download
          CHROME_PATH: /usr/bin/google-chrome
        run: pnpm host-compat --json host-compat.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: host-compat
          path: host-compat.json
