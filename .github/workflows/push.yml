name: Push

on: push

jobs:
  build-and-lint:
    name: Build, lint, and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest
      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build against the oldest supported host
        run: pnpm check-host-floor
      - name: Format check
        run: pnpm prettier --check .

  # Boots the candidate build on hosted JBrowse 5 releases against a ucsc config
  # that names this plugin, and resolves a hosted genome through it. A throw out
  # of configure() error-pages the whole session and is invisible to tsc, eslint
  # and a url check, and a publish reaches configs shipped months ago at once.
  host-compat:
    name: Host compat (candidate build on hosted JBrowse 5 releases)
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest
      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Boot the built bundle on hosted releases
        env:
          # preinstalled on the ubuntu runner image, so puppeteer-core needs no
          # browser action and no Chromium download
          CHROME_PATH: /usr/bin/google-chrome
        run: pnpm host-compat --json host-compat.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: host-compat
          path: host-compat.json
