name: Publish to npm

# Publishes on the v* tag that `pnpm version` pushes (via the postversion
# hook). Uses npm trusted publishing (OIDC) — no NPM_TOKEN secret required.
# One-time setup on npmjs.com: package settings > Trusted Publishers > add this
# repo (GMOD/jbrowse-plugin-hubs) and workflow (publish.yml).
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # trusted publishing (OIDC) requires npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      # The gates `pnpm version` runs locally, for a tag pushed any other way
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check-host-floor
      - run: pnpm host-compat
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm publish --provenance --access public

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # Its own job so the publish token stays read-only, and behind `needs` so
      # a failed publish leaves no release
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The notes are the CHANGELOG.md section git-cliff wrote during
      # `pnpm version`, which is part of the tagged commit
      - name: Create release
        run: |
          ./scripts/release-notes.sh "$GITHUB_REF_NAME" > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file /tmp/notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
